name: Deploy Offline WASM Lab to GitHub Pages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify offline relative paths and zero external assets in web/
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          web = Path("web")
          html = (web / "index.html").read_text(encoding="utf-8")
          assert "./styles.css" in html
          assert "./wasm_bundle.js" in html
          assert "./presets.js" in html
          assert "./app.js" in html
          assert "./scitt_time_anchor.wasm" in html
          for path in sorted(web.iterdir()):
              if path.suffix in (".html", ".css", ".js"):
                  txt = path.read_text(encoding="utf-8")
                  for bad in ["fonts.googleapis", "fonts.gstatic", "cdn.", "unpkg.com", "jsdelivr"]:
                      assert bad not in txt.lower(), f"External reference {bad} in {path}"
                  if path.name in ("index.html", "styles.css"):
                      assert not re.search(r'https?://', txt), f"Unexpected URL in {path}"
          print("Static web/ relative-path and zero-egress audit passed.")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload web artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
