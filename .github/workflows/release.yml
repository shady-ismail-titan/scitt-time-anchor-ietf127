name: Release & SLSA Provenance

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-attest-release:
    name: Build, Verify Forensics, Attest (SLSA v1), and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Rust stable with wasm32 target
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build Python sdist and wheel
        run: |
          export SOURCE_DATE_EPOCH=1795737600
          mkdir -p release-assets
          python3 -m pip install --no-cache-dir build
          python3 -m build --outdir release-assets

      - name: Build native Rust CLI release binary
        run: |
          export SOURCE_DATE_EPOCH=1795737600
          RUSTFLAGS="--remap-path-prefix=${{ github.workspace }}=/src --remap-path-prefix=$HOME=/build -C strip=debuginfo" \
          cargo build --manifest-path scitt_time_anchor_rs/Cargo.toml --release
          cp scitt_time_anchor_rs/target/release/scitt_time_anchor_rs release-assets/scitt_time_anchor_rs-linux-x86_64

      - name: Build zero-import wasm32-unknown-unknown binary
        run: |
          export SOURCE_DATE_EPOCH=1795737600
          RUSTFLAGS="--remap-path-prefix=${{ github.workspace }}=/src --remap-path-prefix=$HOME=/build" \
          cargo build --manifest-path scitt_time_anchor_rs/wasm_cdylib/Cargo.toml --release --target wasm32-unknown-unknown
          cp scitt_time_anchor_rs/wasm_cdylib/target/wasm32-unknown-unknown/release/scitt_time_anchor_wasm.wasm release-assets/scitt_time_anchor.wasm

      - name: Artifact forensics gate on release binaries and wheel
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          forbidden_exact = [
              b"/Users/",
              b"/home/",
              b"gh" + b"p_",
              b"AK" + b"IA",
              b"BEGIN PRIVATE " + b"KEY",
          ]
          forbidden_ci = [b"sci" + b"verify"]

          def scan_blob(label: str, data: bytes) -> None:
              for tok in forbidden_exact:
                  assert tok not in data, f"Forbidden token {tok!r} leaked in {label}"
              lower = data.lower()
              for tok in forbidden_ci:
                  assert tok not in lower, f"Forbidden cross-identity token {tok!r} leaked in {label}"

          assets = Path("release-assets")
          wheels = sorted(assets.glob("*.whl"))
          assert wheels, "No wheel found in release-assets"
          for whl in wheels:
              scan_blob(str(whl), whl.read_bytes())
              with zipfile.ZipFile(whl) as zf:
                  for name in zf.namelist():
                      scan_blob(f"{whl.name}:{name}", zf.read(name))

          for rel in ["scitt_time_anchor_rs-linux-x86_64", "scitt_time_anchor.wasm"]:
              p = assets / rel
              assert p.is_file(), f"Missing release binary: {p}"
              scan_blob(str(p), p.read_bytes())

          print("Release artifact forensics gate passed.")
          PY

      - name: Stage SBOM, OpenVEX, OSPS attestation, and SHA-256 checksums
        run: |
          cp sbom.cdx.json release-assets/sbom.cdx.json
          cp openvex.json release-assets/openvex.json
          cp osps-baseline.json release-assets/osps-baseline.json
          (cd release-assets && sha256sum * > /tmp/SHA256SUMS.release.txt)
          mv /tmp/SHA256SUMS.release.txt release-assets/SHA256SUMS.release.txt

      - name: Attest SLSA v1 build provenance for release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "release-assets/*"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
